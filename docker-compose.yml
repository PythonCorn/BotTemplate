services:
  app:
    build:
      context: .
    container_name: bot_template_app
    env_file:
      - .env
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: .
    container_name: bot_template_worker
    command: python -m app.workers.main
    env_file:
      - .env
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    container_name: bot_template_postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: bot_template_redis
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
