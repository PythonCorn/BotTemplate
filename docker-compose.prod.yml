services:
  app:
    command: >
      sh -c "
      alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      "
    restart: always
    ports:
      - "8000:8000"

  worker:
    restart: always

  postgres:
    restart: always

  redis:
    restart: always

  nginx:
    restart: always
    ports:
      - "80:80"
      # позже добавишь:
      # - "443:443"
